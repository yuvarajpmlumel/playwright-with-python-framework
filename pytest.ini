# pytest.ini
[pytest]
addopts = --headed --browser=chromium --html=reports/report.html --self-contained-html
; addopts = --headed -n auto --browser=chromium --html=reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
; python_files = tests/SearchCases/test_BarEnable_Disable.py
python_functions = test_*
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
